const isAdmin=()=>!!(me&&me.role==='admin');
function setC(c,id,data){(cache[c]=cache[c]||{})[id]=data;last[c+'/'+id]=canon(data)}
function delC(c,id){if(cache[c])delete cache[c][id];delete last[c+'/'+id]}
function rebuild(c){
 if(c==='settings'){db.settings=Object.assign({},DEFSET,(cache.settings||{}).main||{});return}
 if(!DOCS.includes(c))return;
 const f=SORTF[c]||'t';
 db[c]=Object.values(cache[c]||{}).sort((a,b)=>(a[f]||0)-(b[f]||0));
}
const mapUser=r=>({id:r.id,username:r.username,role:r.role,mafiaId:r.mafia_id,created:Date.parse(r.created),lastSeen:Date.parse(r.last_seen)});
async function fetchAll(mk){
 let from=0,out=[];
 for(;;){const{data,error}=await mk().range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break;from+=1000}
 return out;
}
async function loadAll(silent){
 if(loadingAll)return;loadingAll=true;
 try{
  const docs=await fetchAll(()=>sb.from('docs').select('col,id,data').order('col').order('id'));
  cache={};last={};docs.forEach(r=>setC(r.col,r.id,r.data));
  [...DOCS,'settings'].forEach(rebuild);
  if(session){
   const pr=await fetchAll(()=>sb.from('profiles').select('*').order('created').order('id'));
   db.users=pr.map(mapUser);me=db.users.find(u=>u.id===session.user.id)||null;
   if(!me){authErr='Tu perfil no existe o fue eliminado.';await sb.auth.signOut();loadingAll=false;return}
  }else{
   db.users=[];me=null;
   const{data}=await sb.rpc('has_users');hasUsers=!!data;
  }
  bootErr='';
 }catch(e){
  if(!loaded)bootErr=friendly(e);else if(!silent)toast(friendly(e));
 }
 loadingAll=false;loaded=true;render();
}
function ops(){
 const out=[],seen=new Set();
 DOCS.forEach(c=>db[c].forEach(it=>{const k=c+'/'+it.id;seen.add(k);const s=canon(it);if(last[k]!==s)out.push([k,s,it])}));
 if(isAdmin()){const it=Object.assign({id:'main'},db.settings);seen.add('settings/main');if(last['settings/main']!==canon(it))out.push(['settings/main',canon(it),it])}
 Object.keys(last).forEach(k=>{const c=k.split('/')[0];if((DOCS.includes(c)||(c==='settings'&&isAdmin()))&&!seen.has(k))out.push([k,null,null])});
 return out;
}
function save(){
 const o=ops();if(!o.length)return;
 const had=new Set(Object.keys(last));
 o.forEach(([k,s,it])=>{const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);if(it)setC(c,id,JSON.parse(JSON.stringify(it)));else delC(c,id)});
 busy++;
 q=q.then(async()=>{
  for(const[k,s,it]of o){
   const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);let r;
   if(!it)r=await sb.from('docs').delete().eq('col',c).eq('id',id);
   else if(had.has(k))r=await sb.from('docs').update({data:it}).eq('col',c).eq('id',id);
   else r=await sb.from('docs').insert({col:c,id,data:it});
   if(r.error)throw r.error;
  }
 }).catch(e=>{toast(friendly(e));return loadAll(true)}).then(()=>{busy--});
}

   else{const r=p.new;if(!r)return;const isNew=!(cache[r.col]&&cache[r.col][r.id]);setC(r.col,r.id,r.data);rebuild(r.col);notify(r.col,r.data,isNew);soft()}

 return`<div class="card"><h3>Novedades</h3>${n.length?n.map(x=>`<div class="cm" style="border:0;margin:0 0 .7rem;padding:0"><b>${esc(x.title)}</b> <span class="mut">· ${ago(x.t)}</span><p>${esc(x.text)}</p></div>`).join(''):'<p class="mut">Sin novedades. Cuando el admin publique algo, lo verás aquí.</p>'}</div>`;
}
function greet(){const h=new Date().getHours();return h<6?'Buenas noches':h<13?'Buenos días':h<21?'Buenas tardes':'Buenas noches'}
function tlList(a){
 if(!a.length)return'<p class="mut">Sin actividad todavía. Registra tu primer robo.</p>';
 return`<ul class="tl">${a.map(l=>`<li class="${l.type==='ascenso'?'up':l.type==='descenso'?'dn':''}"><b>${l.type==='ascenso'?'Ascenso: ':l.type==='descenso'?'Descenso: ':''}${esc(l.desc)}</b><small>${esc(l.userId?uname(l.userId):'Sistema')} · ${ago(l.t)}${l.pts?` · <span class="${l.pts>0?'ok':'bad'}">${l.pts>0?'+':''}${l.pts} pts</span>`:''}</small></li>`).join('')}</ul>`;
}
function pInicio(){
 const m=mafia(me.mafiaId),scopeR=m?db.robos.filter(r=>r.mafiaId===m.id):db.robos;
 let h='';
 if(m){const s=stats(m.id),rk=rankOf(s.pts),nx=getRanks().find(r=>r.p>s.pts),pct=nx?Math.max(0,Math.min(100,(s.pts-rk.p)/(nx.p-rk.p)*100)):100;
  h+=`<div class="hero" style="--hc:${esc(m.color)}">${sky()}<h2>${greet()}, ${esc(me.username)}</h2><p>${esc(m.name)} · rango ${esc(rk.n)}</p>
  <div class="rk"><div class="l"><b>${s.pts} puntos</b><span class="mut">${nx?`faltan ${nx.p-s.pts} para ${esc(nx.n)}`:'rango máximo'}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div></div>`;
  const rate=s.n?Math.round(s.ok/s.n*100):0;
  h+=`<div class="ledger"><div><small>Mis puntos</small><b>${upts(me.id)}</b></div><div><small>Robos exitosos</small><b class="ok">${s.ok}</b><small>${rate}% de acierto</small></div><div><small>Botín total</small><b>${money(s.total)}</b></div><div><small>Dinero limpio</small><b>${money(s.laund)}</b></div></div>`;
 }else h+=`<div class="hero"><h2>${greet()}, ${esc(me.username)}</h2><p>No perteneces a ninguna mafia. Pide al admin que te asigne una.</p></div>`;
 const pend=db.robos.filter(r=>r.success&&!r.laundered&&(isAdmin()?(!m||r.mafiaId===m.id):r.userId===me.id));
 if(pend.length)h+=`<div class="alert"><span>Tienes <b>${pend.length}</b> robo(s) sin blanquear por <b>${money(pend.reduce((a,r)=>a+r.amount,0))}</b>.</span><button class="btn s" onclick="go('blanqueo')">Ir a blanqueo</button></div>`;
 h+=`<div class="qa"><button onclick="go('robos')">${ico('bag')}Registrar robo</button><button onclick="go('foro')">${ico('cam')}Publicar en el foro</button><button onclick="go('mercado')">${ico('tag')}Mercado negro</button><button onclick="go('chat')">${ico('chat')}Chat de mafia${chatUn?`<span class="badge2">${chatUn}</span>`:''}</button></div>`;
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(6-i));return{d,n:0}});
 scopeR.forEach(r=>{const x=days.find(y=>r.t>=y.d.getTime()&&r.t<y.d.getTime()+864e5);if(x)x.n++});
 const mx=Math.max(1,...days.map(d=>d.n));
 const open=db.missions.filter(x=>x.status==='open'&&(!x.mafiaId||x.mafiaId===me.mafiaId));
 const top=db.users.filter(u=>!m||u.mafiaId===m.id).map(u=>({u,p:upts(u.id)})).sort((a,b)=>b.p-a.p).slice(0,5);
 const rec=[...db.log].filter(l=>!m||l.mafiaId===m.id).sort((a,b)=>b.t-a.t).slice(0,8);
 h+=`<div class="cols"><div>${newsCard()}${adCard()}<div class="card"><h3>Actividad reciente</h3>${tlList(rec)}</div></div>
 <div><div class="card"><h3>Robos de los últimos 7 días</h3><div class="days">${days.map(d=>`<div><span>${d.n||''}</span><i style="height:${Math.round(d.n/mx*80)}%"></i><span>${d.d.toLocaleDateString('es-ES',{weekday:'narrow'})}</span></div>`).join('')}</div></div>
 <div class="card"><h3>Misiones abiertas</h3>${open.length?open.slice(0,4).map(x=>`<div class="mrow"><div class="grow"><b>${esc(x.title)}</b></div><span class="ok">+${num(x.reward,0)}</span></div>`).join('')+`<p style="margin:.6rem 0 0"><button class="lnk" onclick="go('misiones')">Ver todas</button></p>`:'<p class="mut">No hay misiones ahora mismo.</p>'}</div>
 <div class="card"><h3>${m?'Mejores de tu mafia':'Mejores miembros'}</h3>${top.length?top.map((x,i)=>`<div class="mrow">${avatar(x.u)}<div class="grow"><b>${esc(x.u.username)}</b></div><span class="${x.p>=0?'ok':'bad'}">${x.p} pts</span></div>`).join(''):'<p class="mut">Aún no hay miembros.</p>'}</div></div></div>`;
 return h;
}
function logTable(a){
 if(!a.length)return'<p class="mut">Sin actividad todavía.</p>';
 return`<div class="tw"><table><tr><th>Fecha</th><th>Mafia</th><th>Miembro</th><th>Evento</th><th>Pts</th></tr>${a.map(l=>`<tr><td>${fdate(l.t)}</td><td>${mbadge(l.mafiaId)}</td><td>${esc(l.userId?uname(l.userId):'—')}</td><td>${l.type==='ascenso'?'⬆️ ASCENSO: ':l.type==='descenso'?'⬇️ DESCENSO: ':''}${esc(l.desc)}</td><td class="${l.pts>0?'ok':l.pts<0?'bad':'mut'}">${l.pts>0?'+':''}${l.pts}</td></tr>`).join('')}</table></div>`;

function addRobo(){
 if(!me.mafiaId)return toast('Necesitas una mafia.');
 const amt=Math.max(0,Math.round(Number($('#ra').value)||0)),desc=$('#rd').value.trim().slice(0,140),tipo=$('#rt').value,ok=$('#rr').value==='1';
 if(!desc)return toast('Añade una descripción.');
 const r={id:uid(),userId:me.id,mafiaId:me.mafiaId,tipo,desc,amount:amt,success:ok,laundered:false,cleanAmount:0,t:Date.now()};
 db.robos.push(r);addLog(me.mafiaId,me.id,'robo',`${tipo}: ${desc} (${ok?'ÉXITO '+money(amt):'FALLIDO'})`,ok?PT().ok:PT().fail,r.id);save();render();
}
function launderOne(r){
 const fee=Number(db.settings.fee)||0,clean=Math.round(r.amount*(1-fee/100));
 r.laundered=true;r.cleanAmount=clean;r.lt=Date.now();
 addLog(r.mafiaId,me.id,'blanqueo',`Blanqueo de ${money(r.amount)} → ${money(clean)} limpio (comisión ${fee}%)`,PT().l+Math.floor(r.amount/5000),r.id);
}
function launder(id){
 const r=db.robos.find(x=>x.id===id);if(!r||!r.success||r.laundered)return;
 if(!(isAdmin()||r.userId===me.id))return;
 launderOne(r);save();render();
}
function launderAll(){
 const l=db.robos.filter(r=>r.success&&!r.laundered&&(isAdmin()?r.mafiaId===me.mafiaId||!me.mafiaId:r.userId===me.id));
 if(!l.length)return toast('No tienes nada pendiente.');
 l.forEach(launderOne);save();render();toast(l.length+' robo(s) blanqueado(s).');
}
function delRobo(id){ask('¿Eliminar este robo y sus puntos?',()=>{db.robos=db.robos.filter(r=>r.id!==id);db.log=db.log.filter(l=>l.roboId!==id);save();render()})}

/* ---------- Imágenes (Supabase Storage) ---------- */
function compressBlob(file,max){
 return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=()=>rej({message:'No se pudo leer la imagen.'});
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej({message:'Imagen no válida.'});
   im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej({message:'No se pudo procesar la imagen.'}),'image/jpeg',.78)};
   im.src=fr.result};
  fr.readAsDataURL(file);
 });
}
async function uploadImg(file){
 const blob=await compressBlob(file,1024),path=me.id+'/'+uid()+'.jpg';
 const{error}=await sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;
 return sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
}
function removeImg(url){
 const i=String(url||'').indexOf('/fotos/');if(i<0)return;
 sb.storage.from('fotos').remove([decodeURIComponent(url.slice(i+7).split('?')[0])]).catch(()=>{});
}
function pickImg(e){const f=e.target.files[0];pendFile=f||null;const p=$('#prev');if(p)p.innerHTML=f?`<img src="${URL.createObjectURL(f)}" style="max-width:200px;border-radius:8px;margin-top:.5rem" alt="vista previa">`:''}
async function imgFromForm(urlId){
 if(pendFile){toast('Subiendo imagen…');const u=await uploadImg(pendFile);pendFile=null;return u}
 const url=($(urlId)?$(urlId).value.trim():'');return/^https?:\/\//i.test(url)?url:'';
}

/* ---------- Mercado negro ---------- */
async function addMarket(){
 const t=$('#kt').value.trim().slice(0,80),d=$('#kd').value.trim().slice(0,400);
 if(!t)return toast('Pon un título al anuncio.');
 try{
  const img=await imgFromForm('#ku');
  db.market.push({id:uid(),userId:me.id,mafiaId:me.mafiaId,title:t,cat:$('#kc').value,price:Math.max(0,Math.round(Number($('#kp').value)||0)),desc:d,img,status:'open',t:Date.now()});
  save();render();
 }catch(e){toast(friendly(e))}
}
function marketSold(id){const k=db.market.find(x=>x.id===id);if(!k)return;k.status=k.status==='open'?'sold':'open';save();render()}
function delMarket(id){ask('¿Eliminar este anuncio?',()=>{const k=db.market.find(x=>x.id===id);if(k)removeImg(k.img);db.market=db.market.filter(x=>x.id!==id);save();render()})}
function interested(id){
 const k=db.market.find(x=>x.id===id);if(!k||k.userId===me.id)return;
 db.dm.push({id:uid(),from:me.id,to:k.userId,text:`Hola, me interesa tu anuncio «${k.title}» (${money(k.price)}).`,t:Date.now(),read:false});
 save();dmWith=k.userId;go('mensajes');toast('Mensaje enviado al vendedor.');
}
function setMF(k,v){mFilter[k]=v;render()}

 return`<div class="card"><h2>🕶️ Mercado negro</h2><p class="mut">Compra y venta entre miembros dentro del rol. Pulsa «Me interesa» para escribir al vendedor.</p>
 <div class="row"><div><label for="kt">Título</label><input id="kt" maxlength="80" placeholder="Ej: Sultan RS modificado"></div><div><label for="kc">Categoría</label><select id="kc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label for="kp">Precio (€)</label><input id="kp" type="number" min="0" value="0"></div></div>

 <label for="pf">Foto (opcional)</label><input id="pf" type="file" accept="image/*" onchange="pickImg(event)"><div id="prev"></div>
 <label for="ku">…o URL de imagen</label><input id="ku" placeholder="https://..."><br><button class="btn" onclick="addMarket()">Publicar anuncio</button></div>
 <div class="card"><div class="row" style="margin-bottom:.8rem"><div><label for="mfc">Categoría</label><select id="mfc" onchange="setMF('cat',this.value)"><option value="">Todas</option>${CATS.map(c=>`<option ${mFilter.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
 <div><label for="mfo">Mostrar</label><select id="mfo" onchange="setMF('open',this.value==='1')"><option value="1" ${mFilter.open?'selected':''}>Solo disponibles</option><option value="0" ${!mFilter.open?'selected':''}>Todos</option></select></div></div>
 ${l.length?`<div class="posts">${l.map(k=>`<div class="item ${k.status==='sold'?'sold':''}"><div><b>${esc(k.title)}</b> ${k.status==='sold'?'<span class="badge bad" style="border-color:var(--bad)">VENDIDO</span>':''}</div>

 <div class="fx">${k.userId!==me.id&&k.status==='open'?`<button class="btn s" onclick="interested('${k.id}')">Me interesa</button>`:''}${k.userId===me.id?`<button class="btn s g" onclick="marketSold('${k.id}')">${k.status==='open'?'Marcar vendido':'Reabrir'}</button>`:''}${(isAdmin()||k.userId===me.id)?`<button class="btn s d" onclick="delMarket('${k.id}')">Eliminar</button>`:''}</div></div>`).join('')}</div>`:'<p class="mut">No hay anuncios con estos filtros.</p>'}</div>`;

/* ---------- Misiones ---------- */
function reportMission(id){
 const m=db.missions.find(x=>x.id===id);if(!m||!me.mafiaId)return;
 if(db.mission_done.some(d=>d.missionId===id&&d.userId===me.id&&d.status==='pending'))return toast('Ya la has reportado, espera al admin.');
 const note=($('#mn_'+id)?$('#mn_'+id).value.trim():'').slice(0,200);
 db.mission_done.push({id:uid(),missionId:id,userId:me.id,mafiaId:me.mafiaId,note,status:'pending',t:Date.now()});
 save();render();toast('Misión reportada. El admin la revisará.');
}
function pMisiones(){
 const l=db.missions.filter(x=>x.status==='open'&&(isAdmin()||!x.mafiaId||x.mafiaId===me.mafiaId)).sort((a,b)=>b.t-a.t);
 const mine=db.mission_done.filter(d=>d.userId===me.id);
 return`<div class="card"><h2>🎯 Misiones</h2>${l.length?l.map(m=>{const st=mine.filter(d=>d.missionId===m.id).sort((a,b)=>b.t-a.t)[0];
  return`<div class="item" style="margin-bottom:.7rem"><div><b>${esc(m.title)}</b> <span class="ok">+${num(m.reward,0)} pts</span> ${m.mafiaId?mbadge(m.mafiaId):'<span class="badge mut">Para todos</span>'}</div><div>${esc(m.desc)}</div>
  ${st?`<div class="mut">Tu último reporte: ${st.status==='pending'?'⏳ pendiente':st.status==='approved'?'✅ aprobado':'❌ rechazado'}</div>`:''}
  ${me.mafiaId?`<div class="fx"><input id="mn_${m.id}" placeholder="Nota (opcional)" maxlength="200" aria-label="Nota" style="flex:1;min-width:140px"><button class="btn s" onclick="reportMission('${m.id}')">Reportar cumplida</button></div>`:''}</div>`}).join(''):'<p class="mut">No hay misiones disponibles ahora mismo.</p>'}</div>`;
}

/* ---------- Mensajes ---------- */
const unread=()=>me?db.dm.filter(d=>d.to===me.id&&!d.read).length:0;
function markRead(from){let ch=false;db.dm.forEach(d=>{if(d.to===me.id&&d.from===from&&!d.read){d.read=true;ch=true}});if(ch)save()}
function openThread(v){dmWith=v;if(v)markRead(v);render()}
function sendDm(){
 const el=$('#dmt'),t=el?el.value.trim().slice(0,500):'';if(!t||!dmWith)return;
 db.dm.push({id:uid(),from:me.id,to:dmWith,text:t,t:Date.now(),read:false});save();render();
}
function delDm(id){db.dm=db.dm.filter(d=>d.id!==id);save();render()}
function pMensajes(){
 const others=db.users.filter(u=>u.id!==me.id).sort((a,b)=>a.username.localeCompare(b.username));
 const un=u=>db.dm.filter(d=>d.from===u.id&&d.to===me.id&&!d.read).length;
 const th=dmWith?db.dm.filter(d=>(d.from===me.id&&d.to===dmWith)||(d.from===dmWith&&d.to===me.id)).sort((a,b)=>a.t-b.t):[];
 return`<div class="card"><h2>✉️ Mensajes privados</h2><label for="dmw">Conversación con</label>
 <select id="dmw" onchange="openThread(this.value)"><option value="">— elige a alguien —</option>${others.map(u=>`<option value="${u.id}" ${dmWith===u.id?'selected':''}>${esc(u.username)}${un(u)?' ('+un(u)+' nuevos)':''}</option>`).join('')}</select>
 ${dmWith?`<div class="msgs" id="msgs" style="margin-top:.7rem">${th.length?th.map(d=>`<div class="msg ${d.from===me.id?'me':''}"><small>${esc(uname(d.from))} · ${fdate(d.t)} ${d.from===me.id?(d.read?'· leído':''):''} <a href="#" class="mut" onclick="delDm('${d.id}');return false">✕</a></small>${esc(d.text)}</div>`).join(''):'<p class="mut">Aún no hay mensajes. Escribe el primero.</p>'}</div>
 <div class="fx"><input id="dmt" maxlength="500" placeholder="Escribe un mensaje…" aria-label="Mensaje" style="flex:1;min-width:160px" onkeydown="if(event.key==='Enter')sendDm()"><button class="btn" onclick="sendDm()">Enviar</button></div>`:''}
 <p class="hint">Solo tú y la otra persona veis esta conversación.</p></div>`;
}

/* ---------- Progreso ---------- */
function pProgreso(){
 const RK=getRanks();
 const rows=db.mafias.map(m=>({m,s:stats(m.id)})).sort((a,b)=>b.s.pts-a.s.pts);
 const bars=({m,s},i)=>{const rk=rankOf(s.pts),nx=RK.find(r=>r.p>s.pts),pct=nx?Math.min(100,(s.pts-rk.p)/(nx.p-rk.p)*100):100;
  return`<tr><td>#${i+1}</td><td>${mbadge(m.id)}</td><td><b>${esc(rk.n)}</b></td><td style="min-width:150px"><div class="bar"><i style="width:${Math.max(0,pct)}%"></i></div><small class="mut">${s.pts} pts${nx?' / '+nx.p+' → '+esc(nx.n):' (máx.)'}</small></td><td class="ok">${s.ok}</td><td class="bad">${s.fail}</td><td>${money(s.laund)}</td></tr>`};
 const top=db.users.map(u=>({u,p:upts(u.id)})).filter(x=>x.p!==0).sort((a,b)=>b.p-a.p).slice(0,10);
 const scope=isAdmin()?db.robos:db.robos.filter(r=>r.mafiaId===me.mafiaId);
 const by={};scope.filter(r=>r.success).forEach(r=>{by[r.tipo]=(by[r.tipo]||0)+r.amount});
 const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=ent.length?ent[0][1]||1:1;
 const lg=[...db.log].filter(l=>isAdmin()||l.mafiaId===me.mafiaId).sort((a,b)=>b.t-a.t).slice(0,40);
 return`<div class="card"><h2>🏆 Ranking y progreso de mafias</h2><div class="tw"><table><tr><th>Pos</th><th>Mafia</th><th>Rango</th><th>Progreso</th><th>Éxitos</th><th>Fallos</th><th>Blanqueado</th></tr>${rows.map(bars).join('')}</table></div>
 <p class="hint">Éxito ${PT().ok>=0?'+':''}${PT().ok} · fallo ${PT().fail} · blanqueo +${PT().l} (+1 cada 5.000 €) · ajustes y misiones del admin.</p></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h3>Mejores miembros</h3>${top.length?`<table>${top.map((x,i)=>`<tr><td>#${i+1}</td><td>${esc(x.u.username)}</td><td>${mbadge(x.u.mafiaId)}</td><td class="${x.p>=0?'ok':'bad'}">${x.p} pts</td></tr>`).join('')}</table>`:'<p class="mut">Todavía no hay puntos.</p>'}</div>
 <div class="card"><h3>Botín por tipo de robo</h3>${ent.length?ent.map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.round(v/mx*100)}%"></i></div><span>${money(v)}</span></div>`).join(''):'<p class="mut">Sin robos exitosos todavía.</p>'}</div></div>
 <div class="card"><h3>Historial de progreso</h3>${logTable(lg)}</div>`;
}

/* ---------- Administración ---------- */
function saveAd(){
 const u=$('#adu').value.trim();if(u&&!/^https:\/\//i.test(u))return toast('El enlace debe empezar por https://');
 Object.assign(db.settings,{adUrl:u,adTitle:$('#adt').value.trim(),adText:$('#adx').value.trim()});save();toast('Anuncio guardado.');render();
}
function clearAd(){Object.assign(db.settings,{adUrl:'',adText:''});save();render()}
function addNews(){const t=$('#nt').value.trim().slice(0,100),x=$('#nx').value.trim().slice(0,600);if(!t||!x)return toast('Escribe título y texto.');db.news.push({id:uid(),title:t,text:x,t:Date.now()});save();render();toast('Noticia publicada.')}
function delNews(id){db.news=db.news.filter(n=>n.id!==id);save();render()}
function addMafia(){const n=$('#mn').value.trim();if(!n)return;db.mafias.push({id:uid(),name:n,color:$('#mc').value,ord:Date.now()});save();render()}
function delMafia(id){ask('¿Eliminar mafia con sus robos, publicaciones y progreso? Sus miembros quedarán sin mafia.',async()=>{
 db.mafias=db.mafias.filter(m=>m.id!==id);db.robos=db.robos.filter(r=>r.mafiaId!==id);db.posts=db.posts.filter(p=>p.mafiaId!==id);db.log=db.log.filter(l=>l.mafiaId!==id);
 save();await sb.from('profiles').update({mafia_id:''}).eq('mafia_id',id);await loadAll(true)})}
function adjPts(id){const v=parseInt($('#pj'+id).value);if(!v)return;addLog(id,me.id,'ajuste',`Ajuste manual del admin (${v>0?'+':''}${v})`,v);save();render()}
function addMission(){
 const t=$('#mt').value.trim().slice(0,100),d=$('#md').value.trim().slice(0,400);if(!t)return toast('Pon un título.');
 db.missions.push({id:uid(),title:t,desc:d,reward:num($('#mr').value,10),mafiaId:$('#mm').value,status:'open',t:Date.now()});save();render();toast('Misión creada.');
}
function closeMission(id){const m=db.missions.find(x=>x.id===id);if(m){m.status=m.status==='open'?'closed':'open';save();render()}}
function delMission(id){db.missions=db.missions.filter(m=>m.id!==id);db.mission_done=db.mission_done.filter(d=>d.missionId!==id);save();render()}
function reviewMission(id,ok){
 const d=db.mission_done.find(x=>x.id===id);if(!d||d.status!=='pending')return;
 d.status=ok?'approved':'rejected';
 if(ok){const m=db.missions.find(x=>x.id===d.missionId);addLog(d.mafiaId,d.userId,'mision',`Misión «${m?m.title:'?'}» cumplida`,m?num(m.reward,0):0)}
 save();render();
}
async function userAct(fn,msg){const{error}=await fn();if(error)toast(friendly(error));else if(msg)toast(msg);await loadAll(true)}
function setUserMafia(id,v){userAct(()=>sb.from('profiles').update({mafia_id:v}).eq('id',id),'Mafia actualizada.')}
function toggleRole(id){const u=db.users.find(x=>x.id===id);userAct(()=>sb.from('profiles').update({role:u.role==='admin'?'member':'admin'}).eq('id',id),'Rol actualizado.')}
function delUser(id){ask('¿Eliminar este perfil? El usuario perderá el acceso a la web.',()=>userAct(()=>sb.rpc('admin_delete_user',{uid:id}),'Usuario eliminado.'))}
function resetPass(id){ask('Nueva contraseña para este usuario:',p=>{if(!p||p.length<6)return toast('Mínimo 6 caracteres.');userAct(()=>sb.rpc('admin_set_password',{uid:id,pw:p}),'Contraseña cambiada.')},true)}
function filterUsers(v){v=v.toLowerCase();document.querySelectorAll('#utb tr[data-n]').forEach(r=>{r.style.display=r.dataset.n.includes(v)?'':'none'})}
function saveCfg(){
 const s=db.settings;
 s.fee=Math.min(100,Math.max(0,num($('#fee').value,15)));s.ptsOk=num($('#pok').value,10);s.ptsFail=num($('#pfl').value,-5);s.ptsLaunder=num($('#pla').value,5);
 const rk=$('#rks').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf(':');return{n:l.slice(0,i).trim(),p:num(l.slice(i+1),NaN)}});
 if(!rk.length||rk.some(r=>!r.n||!Number.isFinite(r.p)))return toast('Rangos: una línea por rango con el formato Nombre:puntos');
 s.ranks=rk;save();toast('Ajustes guardados.');render();
}

function pAdmin(){
 const T=[['resumen','Resumen'],['noticias','Noticias y anuncio'],['misiones','Misiones'],['mafias','Mafias'],['robos','Robos'],['usuarios','Usuarios'],['foro','Foro'],['mercado','Mercado'],['datos','Ajustes y datos']];
 let h=`<div class="tabs">${T.map(t=>`<button class="${atab===t[0]?'on':''}" onclick="atab='${t[0]}';render()">${t[1]}${t[0]==='misiones'&&db.mission_done.some(d=>d.status==='pending')?'<span class="badge2">!</span>':''}</button>`).join('')}</div>`;
 const s=db.settings;
 if(atab==='resumen'){
  const on=db.users.filter(online).length,pm=db.mission_done.filter(d=>d.status==='pending').length,day=Date.now()-864e5,rd=db.robos.filter(r=>r.t>day);
  h+=`<div class="ledger"><div><small>Miembros</small><b>${db.users.length}</b><small>${on} en línea</small></div><div><small>Robos en 24 h</small><b>${rd.length}</b><small>${money(rd.filter(r=>r.success).reduce((a,r)=>a+r.amount,0))} de botín</small></div><div><small>Misiones por revisar</small><b class="${pm?'bad':''}">${pm}</b></div><div><small>Mercado abierto</small><b>${db.market.filter(k=>k.status==='open').length}</b></div></div>
  <div class="qa"><button onclick="atab='usuarios';render()">${ico('users')}Gestionar usuarios</button><button onclick="atab='noticias';render()">${ico('mail')}Publicar noticia</button><button onclick="atab='misiones';render()">${ico('target')}Crear misión</button><button onclick="atab='mafias';render()">${ico('shield')}Mafias y puntos</button></div>
  <div class="cols"><div class="card"><h3>Mafias</h3>${[...db.mafias].sort((a,c)=>mpts(c.id)-mpts(a.id)).map(m=>`<div class="mrow"><div class="grow">${mbadge(m.id)}<br><small class="mut">${db.users.filter(u=>u.mafiaId===m.id).length} miembros · ${esc(rankOf(mpts(m.id)).n)}</small></div><b>${mpts(m.id)} pts</b></div>`).join('')}</div>
  <div class="card"><h3>Últimas conexiones</h3>${[...db.users].sort((a,c)=>(c.lastSeen||0)-(a.lastSeen||0)).slice(0,8).map(u=>`<div class="mrow">${avatar(u)}<div class="grow"><b>${esc(u.username)}</b></div><small class="mut"><span class="dot ${online(u)?'':'off'}"></span>${ago(u.lastSeen)}</small></div>`).join('')}</div></div>`;
 }
 if(atab==='noticias')h+=`<div class="card"><h2>Publicar noticia</h2><label for="nt">Título</label><input id="nt" maxlength="100"><label for="nx">Texto</label><textarea id="nx" maxlength="600"></textarea><br><button class="btn" onclick="addNews()">Publicar</button></div>
 <div class="card"><h3>Noticias publicadas</h3>${db.news.length?[...db.news].sort((a,b)=>b.t-a.t).map(n=>`<div class="cm" style="margin:0 0 .5rem"><b>${esc(n.title)}</b> <span class="mut">${fdate(n.t)}</span> <button class="btn s d" onclick="delNews('${n.id}')">Eliminar</button><p>${esc(n.text)}</p></div>`).join(''):'<p class="mut">Ninguna todavía.</p>'}</div>
 <div class="card"><h2>Anuncio de la web</h2><label for="adt">Título</label><input id="adt" value="${esc(s.adTitle)}"><label for="adx">Texto (opcional)</label><textarea id="adx">${esc(s.adText)}</textarea>
 <label for="adu">Enlace de Google (Google Sites publicado, Docs, Slides, Forms…)</label><input id="adu" placeholder="https://sites.google.com/..." value="${esc(s.adUrl)}"><br><div class="fx"><button class="btn" onclick="saveAd()">Guardar anuncio</button><button class="btn g" onclick="clearAd()">Quitar anuncio</button></div></div>`;
 if(atab==='misiones'){
  const pend=db.mission_done.filter(d=>d.status==='pending').sort((a,b)=>a.t-b.t);
  h+=`<div class="card"><h2>Crear misión</h2><div class="row"><div><label for="mt">Título</label><input id="mt" maxlength="100"></div><div><label for="mr">Recompensa (pts)</label><input id="mr" type="number" value="20"></div><div><label for="mm">Para</label><select id="mm"><option value="">Todas las mafias</option>${db.mafias.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}</select></div></div>
  <label for="md">Descripción</label><textarea id="md" maxlength="400"></textarea><br><button class="btn" onclick="addMission()">Crear misión</button></div>
  <div class="card"><h3>Reportes pendientes de revisar (${pend.length})</h3>${pend.length?`<div class="tw"><table><tr><th>Fecha</th><th>Miembro</th><th>Mafia</th><th>Misión</th><th>Nota</th><th></th></tr>${pend.map(d=>{const m=db.missions.find(x=>x.id===d.missionId);return`<tr><td>${fdate(d.t)}</td><td>${esc(uname(d.userId))}</td><td>${mbadge(d.mafiaId)}</td><td>${esc(m?m.title:'(borrada)')}</td><td>${esc(d.note)}</td><td><div class="fx"><button class="btn s ok" onclick="reviewMission('${d.id}',true)">Aprobar</button><button class="btn s d" onclick="reviewMission('${d.id}',false)">Rechazar</button></div></td></tr>`}).join('')}</table></div>`:'<p class="mut">No hay reportes pendientes.</p>'}</div>
  <div class="card"><h3>Misiones</h3>${db.missions.length?[...db.missions].sort((a,b)=>b.t-a.t).map(m=>`<div class="cm" style="margin:0 0 .5rem"><b>${esc(m.title)}</b> · +${num(m.reward,0)} pts · ${m.mafiaId?mbadge(m.mafiaId):'todas'} · ${m.status==='open'?'abierta':'cerrada'} <button class="btn s g" onclick="closeMission('${m.id}')">${m.status==='open'?'Cerrar':'Reabrir'}</button> <button class="btn s d" onclick="delMission('${m.id}')">Eliminar</button><p>${esc(m.desc)}</p></div>`).join(''):'<p class="mut">Ninguna todavía.</p>'}</div>`;
 }
 if(atab==='mafias')h+=`<div class="card"><h2>Mafias</h2><div class="tw"><table><tr><th>Mafia</th><th>Miembros</th><th>Puntos</th><th>Ajustar puntos</th><th></th></tr>${db.mafias.map(m=>`<tr><td>${mbadge(m.id)}</td><td>${db.users.filter(u=>u.mafiaId===m.id).length}</td><td>${mpts(m.id)} · ${esc(rankOf(mpts(m.id)).n)}</td><td><div class="fx"><input id="pj${esc(m.id)}" type="number" placeholder="+/-" aria-label="Puntos" style="width:90px"><button class="btn s g" onclick="adjPts('${m.id}')">Aplicar</button></div></td><td><button class="btn s d" onclick="delMafia('${m.id}')">Eliminar</button></td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>Añadir mafia</h3><div class="row"><div><label for="mn">Nombre</label><input id="mn"></div><div><label for="mc">Color</label><input id="mc" type="color" value="#e11d48" style="height:40px;padding:2px"></div><div><button class="btn" onclick="addMafia()">Añadir</button></div></div></div>`;
 if(atab==='robos')h+=`<div class="card"><h2>Todos los robos</h2>${roboTable(db.robos,true)}</div>`;
 if(atab==='usuarios')h+=pUsuarios();
 if(atab==='foro')h+=`<div class="card"><h2>Moderación del foro</h2>${postsGrid()}</div>`;
 if(atab==='mercado')h+=`<div class="card"><h2>Moderación del mercado negro</h2>${db.market.length?`<div class="tw"><table><tr><th>Fecha</th><th>Vendedor</th><th>Anuncio</th><th>Precio</th><th>Estado</th><th></th></tr>${[...db.market].sort((a,b)=>b.t-a.t).map(k=>`<tr><td>${fdate(k.t)}</td><td>${esc(uname(k.userId))}</td><td>${esc(k.title)}</td><td>${money(k.price)}</td><td>${k.status==='open'?'Disponible':'Vendido'}</td><td><button class="btn s d" onclick="delMarket('${k.id}')">Eliminar</button></td></tr>`).join('')}</table></div>`:'<p class="mut">Sin anuncios.</p>'}</div>`;
 if(atab==='datos')h+=`<div class="card"><h2>Ajustes</h2><div class="row"><div><label for="fee">Comisión de blanqueo (%)</label><input id="fee" type="number" min="0" max="100" value="${num(s.fee,15)}"></div><div><label for="pok">Puntos por robo exitoso</label><input id="pok" type="number" value="${num(s.ptsOk,10)}"></div><div><label for="pfl">Puntos por robo fallido</label><input id="pfl" type="number" value="${num(s.ptsFail,-5)}"></div><div><label for="pla">Puntos base por blanqueo</label><input id="pla" type="number" value="${num(s.ptsLaunder,5)}"></div></div>
 <label for="rks">Rangos (una línea por rango, formato Nombre:puntos)</label><textarea id="rks" rows="6">${esc(getRanks().map(r=>r.n+':'+r.p).join('\n'))}</textarea><br><button class="btn" onclick="saveCfg()">Guardar ajustes</button></div>
 <div class="card"><h2>Exportar progreso</h2><div class="fx"><button class="btn" onclick="expCSV()">Descargar progreso (CSV)</button><button class="btn g" onclick="expJSON()">Copia completa (JSON)</button></div>
 <p class="hint">Los datos están en tu proyecto de Supabase y se actualizan en tiempo real para todos los miembros. Usa el CSV o el JSON para llevar el progreso de las mafias a un sitio externo.</p></div>`;
 return h;
}

/* ---------- Arranque ---------- */
async function handleAuth(ev,s){
 session=s||null;
 if(ev==='PASSWORD_RECOVERY'){recovering=true;authMode='recover';loaded=true;render();return}
 if(ev==='TOKEN_REFRESHED')return;
 if(session){
  if(loadedFor===session.user.id&&ev!=='SIGNED_IN')return;
  if(loadedFor===session.user.id&&me)return;
  loadedFor=session.user.id;
  await loadAll();
  if(session&&me){
   startRealtime();sb.rpc('touch_me');
   clearInterval(touchT);touchT=setInterval(()=>{if(session)sb.rpc('touch_me')},60000);
   if(joinMsg){joinMsg=false;if(me.mafiaId){addLog(me.mafiaId,me.id,'ingreso',`${me.username} se une a la mafia`,0);save()}}
  }
 }else{
  loadedFor='';stopRealtime();clearInterval(touchT);recovering=false;if(authMode!=='forgot')authMode='login';
  await loadAll();
 }
}
function boot(){
 if(SUPABASE_URL==='PEGA_AQUI'||SUPABASE_KEY==='PEGA_AQUI'){
  $('#app').innerHTML=`<div class="centerbox"><div class="card"><h2>Falta conectar Supabase</h2><p>Abre <code>index.html</code> con un editor de texto y pega tu <b>Project URL</b> y tu clave <b>anon / publishable</b> donde dice <b>PEGA AQUÍ LOS DOS DATOS</b>. Después vuelve a subirlo.</p></div></div>`;return;
 }
 if(!window.supabase){$('#app').innerHTML='<div class="centerbox"><div class="card"><h2>No se pudo cargar Supabase</h2><p class="mut">Comprueba tu conexión a internet y recarga.</p></div></div>';return}
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 render();
 sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>handleAuth(ev,s),0)});
 setInterval(()=>{if(me&&!$('#ovl').innerHTML&&page==='admin'&&atab==='usuarios')soft()},30000);
}
boot();
</script>
