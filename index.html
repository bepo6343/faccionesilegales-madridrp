<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Madrid Underground RP</title>
<style>
:root{color-scheme:dark;--bg:#0b0b10;--card:#15151d;--card2:#1c1c27;--line:#2a2a3a;--tx:#e8e8f0;--mut:#8b8ba0;--ac:#e11d48;--ac2:#f59e0b;--ok:#22c55e;--bad:#ef4444;--warn:#3a2a08}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0 0 .6rem}h2{font-size:1.25rem}h3{font-size:1.05rem;color:var(--ac2)}
a{color:var(--ac2)}
header{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;padding:.8rem 0;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.5px}.logo b{color:var(--ac)}
nav{display:flex;flex-wrap:wrap;gap:.3rem}
nav button{background:transparent;border:1px solid transparent;color:var(--mut);padding:.45rem .8rem;border-radius:8px;cursor:pointer;font:inherit}
nav button:hover{color:var(--tx)}nav button.on{background:var(--card2);color:var(--tx);border-color:var(--line)}
.user{display:flex;gap:.6rem;align-items:center;font-size:.9rem;color:var(--mut);flex-wrap:wrap}
main{max-width:1150px;margin:0 auto;padding-block:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem;margin-bottom:1rem;min-width:0}
.grid{display:grid;gap:1rem}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.9rem}
.stat small{color:var(--mut);display:block}.stat b{font-size:1.5rem}
input,select,textarea{width:100%;background:#0e0e15;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;font:inherit}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:.8rem;color:var(--mut);margin:.5rem 0 .2rem}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem;align-items:end}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:.55rem 1rem;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.12)}.btn.s{padding:.25rem .6rem;font-size:.8rem}.btn.g{background:var(--card2);border:1px solid var(--line);color:var(--tx)}.btn.ok{background:var(--ok);color:#04130a}.btn.d{background:#7f1d1d}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:.5rem .45rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-size:.75rem;font-weight:700;border:1px solid}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.bar{height:8px;background:#0e0e15;border-radius:9px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.post{background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.post img{width:100%;height:220px;object-fit:cover;display:block;background:#000}
.post div{padding:.7rem}
.post p{margin:.4rem 0;font-weight:600;overflow-wrap:anywhere}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.tabs button{background:var(--card2);color:var(--mut);border:1px solid var(--line);padding:.4rem .8rem;border-radius:8px;cursor:pointer;font:inherit}.tabs button.on{color:#fff;background:var(--ac);border-color:var(--ac)}
.auth{max-width:440px;margin:6vh auto;padding-block:1rem}
.hint{font-size:.78rem;color:var(--mut);margin-top:.6rem}
.err{color:var(--bad);font-size:.85rem;min-height:1.2rem;margin-top:.4rem}
.fx{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.mask{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px}
.dlg{max-width:380px;width:100%;margin:0}
#toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);background:var(--card2);color:var(--tx);border:1px solid var(--line);padding:.6rem 1rem;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin-bottom:1rem}
.sum .stat b{font-size:1.3rem}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:.35rem}
.dot.off{background:var(--line)}
.badge2{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--ac);color:#fff;font-size:.72rem;font-weight:700;text-align:center;margin-left:.3rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:.15rem .6rem;font-size:.85rem;cursor:pointer;color:var(--tx);font:inherit}
.chip.on{border-color:var(--ac2);background:#2a1d08}
.msgs{display:flex;flex-direction:column;gap:.4rem;max-height:420px;overflow-y:auto;padding:.4rem;background:#0e0e15;border:1px solid var(--line);border-radius:10px;margin-bottom:.6rem}
.msg{max-width:80%;padding:.4rem .7rem;border-radius:12px;background:var(--card2);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:#3a0f1c}
.msg small{display:block;color:var(--mut);font-size:.7rem}
.item{display:grid;gap:.4rem;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.8rem;min-width:0}
.item img{max-width:100%;max-height:200px;object-fit:cover;border-radius:8px}
.price{font-weight:800;color:var(--ac2);font-size:1.1rem}
.cm{border-top:1px solid var(--line);margin-top:.5rem;padding-top:.5rem;font-size:.88rem}
.cm p{margin:.15rem 0;overflow-wrap:anywhere}
.hbar{display:grid;grid-template-columns:110px 1fr auto;gap:.5rem;align-items:center;font-size:.85rem;margin:.25rem 0}
.sold{opacity:.55}
code{background:#0e0e15;padding:.1rem .35rem;border-radius:5px}
</style>
</head>
<body>
<div id="app"></div><div id="ovl"></div><div id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
/* ============ PEGA AQUÍ LOS DOS DATOS DE TU PROYECTO DE SUPABASE ============ */
const SUPABASE_URL="https://psxtwocqtrtnsubplkaz.supabase.co";        // Project URL  (empieza por https:// y acaba en .supabase.co)
const SUPABASE_KEY="sb_publishable_VW7AJF6iP_bk52Olztsr_g_kJ0Chf7v";        // clave "anon public" o "publishable"
/* ============================================================================== */

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const money=n=>(Number(n)||0).toLocaleString('es-ES')+' €';
const fdate=t=>new Date(t).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'});
const ago=t=>{if(!t)return'Nunca';const m=Math.floor((Date.now()-t)/60000);if(m<1)return'Ahora mismo';if(m<60)return'hace '+m+' min';if(m<1440)return'hace '+Math.floor(m/60)+' h';return fdate(t)};
const num=(v,d)=>(v===''||v==null||!Number.isFinite(Number(v)))?d:Number(v);
function canon(x){if(Array.isArray(x))return'['+x.map(canon).join(',')+']';if(x&&typeof x==='object')return'{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+canon(x[k])).join(',')+'}';return JSON.stringify(x)}

const TIPOS=['Coche','Gasolinera','ATM / Cajero','Tienda 24h','Joyería','Banco','Camión de transporte','Casa','Otro'];
const CATS=['Vehículos','Armamento (RP)','Documentación falsa','Joyas y objetos','Información','Servicios','Otros'];
const EMOJIS=['😂','🔥','💀','👏'];
const DOCS=['mafias','robos','posts','log','news','missions','mission_done','market','dm','comments','react'];
const DEFRANKS=[{n:'Banda emergente',p:0},{n:'Soldados',p:50},{n:'Capos',p:150},{n:'Cártel',p:300},{n:'Imperio',p:600}];
const DEFSET={adUrl:'',adTitle:'Anuncio del servidor',adText:'',fee:15,ptsOk:10,ptsFail:-5,ptsLaunder:5,ranks:DEFRANKS};
const SORTF={mafias:'ord'};

let sb=null,session=null,me=null,recovering=false,hasUsers=true,loaded=false,bootErr='',loadedFor='',rt=null,touchT=null,joinMsg=false;
let db={users:[],settings:{...DEFSET}};DOCS.forEach(c=>db[c]=[]);
let cache={},last={},busy=0,q=Promise.resolve(),loadingAll=false;
let page='inicio',atab='noticias',authMode='login',authErr='',authOk='',dmWith='',pendFile=null,mFilter={cat:'',open:true},rFilter={tipo:'',res:'',mafia:''};

function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className=''},3800)}
function ask(msg,fn,inp){
 const o=$('#ovl');
 o.innerHTML=`<div class="mask"><div class="card dlg" role="dialog"><p>${esc(msg)}</p>${inp?'<input id="dlgi" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">':''}<div class="fx" style="margin-top:.7rem"><button class="btn" id="dlgok">Aceptar</button><button class="btn g" id="dlgno">Cancelar</button></div></div></div>`;
 const close=()=>{o.innerHTML=''};
 $('#dlgno').onclick=close;$('#dlgok').onclick=()=>{const v=inp?$('#dlgi').value:true;close();fn(v)};
 if(inp)$('#dlgi').focus();
}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function friendly(e){
 const m=String((e&&(e.message||e.msg))||e||'');
 if(/Invalid login credentials/i.test(m))return'Correo o contraseña incorrectos.';
 if(/already registered|already been registered/i.test(m))return'Ese correo ya está registrado.';
 if(m==='USUARIO_EXISTE')return'Ese usuario ya existe.';
 if(/at least 6|Password should/i.test(m))return'La contraseña debe tener al menos 6 caracteres.';
 if(/not confirmed/i.test(m))return'Debes confirmar el correo. El admin puede desactivar esta opción en Supabase.';
 if(/rate limit|too many/i.test(m))return'Demasiados intentos. Espera unos minutos.';
 if(/Database error saving new user/i.test(m))return'No se pudo crear la cuenta. Revisa el usuario y la mafia elegida.';
 if(/invalid email|email address/i.test(m)&&/invalid/i.test(m))return'El correo no es válido.';
 if(/Failed to fetch|NetworkError|network/i.test(m))return'Sin conexión con el servidor.';
 return m||'Error desconocido.';
}

/* ---------- Datos: caché local sincronizada con Supabase ---------- */
const isAdmin=()=>!!(me&&me.role==='admin');
function setC(c,id,data){(cache[c]=cache[c]||{})[id]=data;last[c+'/'+id]=canon(data)}
function delC(c,id){if(cache[c])delete cache[c][id];delete last[c+'/'+id]}
function rebuild(c){
 if(c==='settings'){db.settings=Object.assign({},DEFSET,(cache.settings||{}).main||{});return}
 if(!DOCS.includes(c))return;
 const f=SORTF[c]||'t';
 db[c]=Object.values(cache[c]||{}).sort((a,b)=>(a[f]||0)-(b[f]||0));
}
const mapUser=r=>({id:r.id,username:r.username,role:r.role,mafiaId:r.mafia_id,created:Date.parse(r.created),lastSeen:Date.parse(r.last_seen)});
async function fetchAll(mk){
 let from=0,out=[];
 for(;;){const{data,error}=await mk().range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break;from+=1000}
 return out;
}
async function loadAll(silent){
 if(loadingAll)return;loadingAll=true;
 try{
  const docs=await fetchAll(()=>sb.from('docs').select('col,id,data').order('col').order('id'));
  cache={};last={};docs.forEach(r=>setC(r.col,r.id,r.data));
  [...DOCS,'settings'].forEach(rebuild);
  if(session){
   const pr=await fetchAll(()=>sb.from('profiles').select('*').order('created').order('id'));
   db.users=pr.map(mapUser);me=db.users.find(u=>u.id===session.user.id)||null;
   if(!me){authErr='Tu perfil no existe o fue eliminado.';await sb.auth.signOut();loadingAll=false;return}
  }else{
   db.users=[];me=null;
   const{data}=await sb.rpc('has_users');hasUsers=!!data;
  }
  bootErr='';
 }catch(e){
  if(!loaded)bootErr=friendly(e);else if(!silent)toast(friendly(e));
 }
 loadingAll=false;loaded=true;render();
}
function ops(){
 const out=[],seen=new Set();
 DOCS.forEach(c=>db[c].forEach(it=>{const k=c+'/'+it.id;seen.add(k);const s=canon(it);if(last[k]!==s)out.push([k,s,it])}));
 if(isAdmin()){const it=Object.assign({id:'main'},db.settings);seen.add('settings/main');if(last['settings/main']!==canon(it))out.push(['settings/main',canon(it),it])}
 Object.keys(last).forEach(k=>{const c=k.split('/')[0];if((DOCS.includes(c)||(c==='settings'&&isAdmin()))&&!seen.has(k))out.push([k,null,null])});
 return out;
}
function save(){
 const o=ops();if(!o.length)return;
 const had=new Set(Object.keys(last));
 o.forEach(([k,s,it])=>{const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);if(it)setC(c,id,JSON.parse(JSON.stringify(it)));else delC(c,id)});
 busy++;
 q=q.then(async()=>{
  for(const[k,s,it]of o){
   const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);let r;
   if(!it)r=await sb.from('docs').delete().eq('col',c).eq('id',id);
   else if(had.has(k))r=await sb.from('docs').update({data:it}).eq('col',c).eq('id',id);
   else r=await sb.from('docs').insert({col:c,id,data:it});
   if(r.error)throw r.error;
  }
 }).catch(e=>{toast(friendly(e));return loadAll(true)}).then(()=>{busy--});
}

/* ---------- Tiempo real ---------- */
function startRealtime(){
 stopRealtime();
 rt=sb.channel('mrp')
  .on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
   if(p.eventType==='DELETE'){const o=p.old;if(o&&o.col){delC(o.col,o.id);rebuild(o.col);if(o.col==='settings')render();else soft()}}
   else{const r=p.new;if(!r)return;const isNew=!(cache[r.col]&&cache[r.col][r.id]);setC(r.col,r.id,r.data);rebuild(r.col);notify(r.col,r.data,isNew);soft()}
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},p=>{
   if(p.eventType==='DELETE'){const id=p.old&&p.old.id;db.users=db.users.filter(u=>u.id!==id);if(me&&id===me.id)logout();else soft()}
   else{const u=mapUser(p.new),i=db.users.findIndex(x=>x.id===u.id);if(i<0)db.users.push(u);else db.users[i]=u;if(me&&u.id===me.id)me=u;soft()}
  })
  .subscribe();
}
function stopRealtime(){if(rt){try{sb.removeChannel(rt)}catch(e){}rt=null}}
function notify(c,d,isNew){
 if(!me)return;
 if(c==='news'&&isNew&&page!=='inicio')toast('📰 Noticia: '+d.title);
 if(c==='dm'&&d.to===me.id&&isNew){
  if(page==='mensajes'&&dmWith===d.from){markRead(d.from)}
  else toast('✉️ Mensaje de '+uname(d.from));
 }
 if(c==='mission_done'&&d.userId===me.id&&d.status!=='pending'&&!isNew)toast(d.status==='approved'?'✅ Misión aprobada':'❌ Misión rechazada');
 if(c==='market'&&isNew&&d.userId!==me.id&&page!=='mercado')toast('🕶️ Nuevo en el mercado negro: '+d.title);
}

/* ---------- Utilidades ---------- */
const mafia=id=>db.mafias.find(m=>m.id===id);
const uname=id=>(db.users.find(u=>u.id===id)||{username:'(eliminado)'}).username;
const getRanks=()=>{const r=db.settings.ranks;return(Array.isArray(r)&&r.length?[...r]:[...DEFRANKS]).sort((a,b)=>a.p-b.p)};
const rankOf=p=>[...getRanks()].reverse().find(r=>p>=r.p)||getRanks()[0];
const mpts=id=>db.log.filter(l=>l.mafiaId===id).reduce((a,l)=>a+(Number(l.pts)||0),0);
const upts=id=>db.log.filter(l=>l.userId===id).reduce((a,l)=>a+(Number(l.pts)||0),0);
const PT=()=>({ok:num(db.settings.ptsOk,10),fail:num(db.settings.ptsFail,-5),l:num(db.settings.ptsLaunder,5)});
const mbadge=id=>{const m=mafia(id);return m?`<span class="badge" style="color:${esc(m.color)};border-color:${esc(m.color)}">${esc(m.name)}</span>`:'<span class="badge mut">Sin mafia</span>'};
function addLog(mafiaId,userId,type,desc,pts,roboId){
 const before=rankOf(mpts(mafiaId));
 db.log.push({id:uid(),t:Date.now(),mafiaId,userId,type,desc,pts,roboId:roboId||''});
 const after=rankOf(mpts(mafiaId));
 if(before.n!==after.n){const up=after.p>before.p;db.log.push({id:uid(),t:Date.now()+1,mafiaId,userId:'',type:up?'ascenso':'descenso',desc:`${before.n} → ${after.n}`,pts:0,roboId:''})}
}
function go(p){page=p;render()}
function soft(){
 if(!loaded||$('#ovl').innerHTML)return;
 const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
 render();
}
async function logout(){await sb.auth.signOut()}

/* ---------- Acceso ---------- */
async function doAuth(){
 authErr='';authOk='';
 const g=id=>($(id)?$(id).value.trim():'');
 try{
  if(authMode==='login'){
   const{error}=await sb.auth.signInWithPassword({email:g('#ae'),password:$('#ap').value});if(error)throw error;
  }else if(authMode==='register'){
   const un=g('#au'),em=g('#ae'),pw=$('#ap').value,mid=g('#am');
   if(!/^[A-Za-z0-9._-]{3,20}$/.test(un))throw{message:'Usuario: 3-20 caracteres (letras, números, . _ -).'};
   if(!/^\S+@\S+\.\S+$/.test(em))throw{message:'Escribe un correo válido.'};
   if(pw.length<6)throw{message:'La contraseña debe tener al menos 6 caracteres.'};
   if(!mafia(mid))throw{message:'Elige una mafia.'};
   const f=await sb.rpc('username_free',{un});if(f.error)throw f.error;if(!f.data)throw{message:'USUARIO_EXISTE'};
   joinMsg=true;
   const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{username:un,mafia_id:mid}}});
   if(error){joinMsg=false;throw error}
   if(!data.session){joinMsg=false;authMode='login';authOk='Cuenta creada. Confirma tu correo y después entra.'}
  }else if(authMode==='forgot'){
   const{error}=await sb.auth.resetPasswordForEmail(g('#ae'),{redirectTo:location.href.split('#')[0]});if(error)throw error;
   authMode='login';authOk='Si el correo existe, te hemos enviado un enlace para cambiar la contraseña.';
  }else if(authMode==='recover'){
   const pw=$('#ap').value;if(pw.length<6)throw{message:'La contraseña debe tener al menos 6 caracteres.'};
   const{error}=await sb.auth.updateUser({password:pw});if(error)throw error;
   recovering=false;authMode='login';toast('Contraseña cambiada.');
  }
 }catch(e){authErr=friendly(e)}
 render();
}
function renderAuth(){
 const m=authMode,reg=m==='register';
 const tabs=m==='forgot'||m==='recover'?'':`<div class="tabs"><button class="${m==='login'?'on':''}" onclick="authMode='login';authErr='';authOk='';render()">Entrar</button><button class="${reg?'on':''}" onclick="authMode='register';authErr='';authOk='';render()">Registrarse</button></div>`;
 const k=e=>`onkeydown="if(event.key==='Enter')doAuth()"`;
 $('#app').innerHTML=`<div class="auth"><div class="card"><h1 class="logo" style="font-size:1.6rem">MADRID <b>UNDERGROUND</b></h1><p class="mut">Panel de mafias · Servidor de rol de Madrid</p>${tabs}
 ${m==='recover'?'<p>Escribe tu nueva contraseña.</p>':''}
 ${reg?`<label for="au">Usuario</label><input id="au" autocomplete="username" ${k()}>`:''}
 ${m!=='recover'?`<label for="ae">Correo</label><input id="ae" type="email" autocomplete="email" ${k()}>`:''}
 ${m!=='forgot'?`<label for="ap">${m==='recover'?'Nueva contraseña':'Contraseña'}</label><input id="ap" type="password" autocomplete="${m==='login'?'current-password':'new-password'}" ${k()}>`:''}
 ${reg?`<label for="am">Mafia</label><select id="am">${db.mafias.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select>`:''}
 <div class="err">${esc(authErr)}</div>${authOk?`<div class="ok" style="font-size:.85rem;margin-bottom:.4rem">${esc(authOk)}</div>`:''}
 <button class="btn" style="width:100%;margin-top:.4rem" onclick="doAuth()">${{login:'Entrar',register:'Crear cuenta',forgot:'Enviar enlace',recover:'Guardar contraseña'}[m]}</button>

function addRobo(){

 const amt=Math.max(0,Math.round(Number($('#ra').value)||0)),desc=$('#rd').value.trim().slice(0,140),tipo=$('#rt').value,ok=$('#rr').value==='1';
 if(!desc)return toast('Añade una descripción.');
 const r={id:uid(),userId:me.id,mafiaId:me.mafiaId,tipo,desc,amount:amt,success:ok,laundered:false,cleanAmount:0,t:Date.now()};
 db.robos.push(r);addLog(me.mafiaId,me.id,'robo',`${tipo}: ${desc} (${ok?'ÉXITO '+money(amt):'FALLIDO'})`,ok?PT().ok:PT().fail,r.id);save();render();

function launderOne(r){
 const fee=Number(db.settings.fee)||0,clean=Math.round(r.amount*(1-fee/100));
 r.laundered=true;r.cleanAmount=clean;r.lt=Date.now();
 addLog(r.mafiaId,me.id,'blanqueo',`Blanqueo de ${money(r.amount)} → ${money(clean)} limpio (comisión ${fee}%)`,PT().l+Math.floor(r.amount/5000),r.id);

function launder(id){
 const r=db.robos.find(x=>x.id===id);if(!r||!r.success||r.laundered)return;

/* ---------- Imágenes (Supabase Storage) ---------- */
function compressBlob(file,max){
 return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=()=>rej({message:'No se pudo leer la imagen.'});
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej({message:'Imagen no válida.'});
   im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej({message:'No se pudo procesar la imagen.'}),'image/jpeg',.78)};
   im.src=fr.result};
  fr.readAsDataURL(file);
 });
}
async function uploadImg(file){
 const blob=await compressBlob(file,1024),path=me.id+'/'+uid()+'.jpg';
 const{error}=await sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;
 return sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
}
function removeImg(url){
 const i=String(url||'').indexOf('/fotos/');if(i<0)return;
 sb.storage.from('fotos').remove([decodeURIComponent(url.slice(i+7).split('?')[0])]).catch(()=>{});
}
function pickImg(e){const f=e.target.files[0];pendFile=f||null;const p=$('#prev');if(p)p.innerHTML=f?`<img src="${URL.createObjectURL(f)}" style="max-width:200px;border-radius:8px;margin-top:.5rem" alt="vista previa">`:''}
async function imgFromForm(urlId){
 if(pendFile){toast('Subiendo imagen…');const u=await uploadImg(pendFile);pendFile=null;return u}
 const url=($(urlId)?$(urlId).value.trim():'');return/^https?:\/\//i.test(url)?url:'';
}

/* ---------- Progreso ---------- */
function pProgreso(){
 const RK=getRanks();
 const rows=db.mafias.map(m=>({m,s:stats(m.id)})).sort((a,b)=>b.s.pts-a.s.pts);
 const bars=({m,s},i)=>{const rk=rankOf(s.pts),nx=RK.find(r=>r.p>s.pts),pct=nx?Math.min(100,(s.pts-rk.p)/(nx.p-rk.p)*100):100;
  return`<tr><td>#${i+1}</td><td>${mbadge(m.id)}</td><td><b>${esc(rk.n)}</b></td><td style="min-width:150px"><div class="bar"><i style="width:${Math.max(0,pct)}%"></i></div><small class="mut">${s.pts} pts${nx?' / '+nx.p+' → '+esc(nx.n):' (máx.)'}</small></td><td class="ok">${s.ok}</td><td class="bad">${s.fail}</td><td>${money(s.laund)}</td></tr>`};
 const top=db.users.map(u=>({u,p:upts(u.id)})).filter(x=>x.p!==0).sort((a,b)=>b.p-a.p).slice(0,10);
 const scope=isAdmin()?db.robos:db.robos.filter(r=>r.mafiaId===me.mafiaId);
 const by={};scope.filter(r=>r.success).forEach(r=>{by[r.tipo]=(by[r.tipo]||0)+r.amount});
 const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=ent.length?ent[0][1]||1:1;
 const lg=[...db.log].filter(l=>isAdmin()||l.mafiaId===me.mafiaId).sort((a,b)=>b.t-a.t).slice(0,40);
 return`<div class="card"><h2>🏆 Ranking y progreso de mafias</h2><div class="tw"><table><tr><th>Pos</th><th>Mafia</th><th>Rango</th><th>Progreso</th><th>Éxitos</th><th>Fallos</th><th>Blanqueado</th></tr>${rows.map(bars).join('')}</table></div>
 <p class="hint">Éxito ${PT().ok>=0?'+':''}${PT().ok} · fallo ${PT().fail} · blanqueo +${PT().l} (+1 cada 5.000 €) · ajustes y misiones del admin.</p></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h3>Mejores miembros</h3>${top.length?`<table>${top.map((x,i)=>`<tr><td>#${i+1}</td><td>${esc(x.u.username)}</td><td>${mbadge(x.u.mafiaId)}</td><td class="${x.p>=0?'ok':'bad'}">${x.p} pts</td></tr>`).join('')}</table>`:'<p class="mut">Todavía no hay puntos.</p>'}</div>
 <div class="card"><h3>Botín por tipo de robo</h3>${ent.length?ent.map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.round(v/mx*100)}%"></i></div><span>${money(v)}</span></div>`).join(''):'<p class="mut">Sin robos exitosos todavía.</p>'}</div></div>
 <div class="card"><h3>Historial de progreso</h3>${logTable(lg)}</div>`;
}

/* ---------- Estructura de la página ---------- */
function render(){
 if(!loaded){$('#app').innerHTML='<div class="auth"><div class="card"><p class="mut">Cargando…</p></div></div>';return}
 if(bootErr){$('#app').innerHTML=`<div class="auth"><div class="card"><h2>No se pudo cargar la web</h2><p class="bad">${esc(bootErr)}</p><button class="btn" onclick="location.reload()">Reintentar</button></div></div>`;return}
 if(recovering)return renderAuth();
 if(!session||!me)return renderAuth();
 const un=unread();
 const P=[['inicio','Inicio'],['robos','Robos'],['blanqueo','Blanqueo'],['mercado','Mercado negro'],['misiones','Misiones'],['foro','Foro'],['mensajes','Mensajes'+(un?`<span class="badge2">${un}</span>`:'')],['progreso','Progreso'],['perfil','Perfil']];
 if(isAdmin())P.push(['admin','⚙️ Admin']);
 const f={inicio:pInicio,robos:pRobos,blanqueo:pBlanqueo,mercado:pMercado,misiones:pMisiones,foro:pForo,mensajes:pMensajes,progreso:pProgreso,perfil:pPerfil,admin:pAdmin};
 if(page==='admin'&&!isAdmin())page='inicio';
 $('#app').innerHTML=`<header><div class="logo">MADRID <b>UNDERGROUND</b></div><nav>${P.map(p=>`<button class="${page===p[0]?'on':''}" onclick="go('${p[0]}')">${p[1]}</button>`).join('')}</nav>
 <div class="user"><span class="ok">● en línea</span>${esc(me.username)} ${mbadge(me.mafiaId)}<button class="btn s g" onclick="logout()">Salir</button></div></header><main>${f[page]()}</main>`;
 const mg=$('#msgs');if(mg)mg.scrollTop=mg.scrollHeight;
}

/* ---------- Arranque ---------- */
async function handleAuth(ev,s){
 session=s||null;
 if(ev==='PASSWORD_RECOVERY'){recovering=true;authMode='recover';loaded=true;render();return}
 if(ev==='TOKEN_REFRESHED')return;
 if(session){
  if(loadedFor===session.user.id&&ev!=='SIGNED_IN')return;
  if(loadedFor===session.user.id&&me)return;
  loadedFor=session.user.id;
  await loadAll();
  if(session&&me){
   startRealtime();sb.rpc('touch_me');
   clearInterval(touchT);touchT=setInterval(()=>{if(session)sb.rpc('touch_me')},60000);
   if(joinMsg){joinMsg=false;if(me.mafiaId){addLog(me.mafiaId,me.id,'ingreso',`${me.username} se une a la mafia`,0);save()}}
  }
 }else{
  loadedFor='';stopRealtime();clearInterval(touchT);recovering=false;if(authMode!=='forgot')authMode='login';
  await loadAll();
 }
}
